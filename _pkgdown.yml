url: https://anhsmith.github.io/bicountbrms/

template:
  bootstrap: 5
  math-rendering: katex

authors:
  footer:
    roles: [aut, cre]
  sidebar:
    roles: [aut, cre]

# Everything under vignettes/articles/ must be named with its `articles/`
# prefix here. pkgdown evaluates a bare entry as an R expression, so a
# hyphenated name such as `partially-paired-designs` is parsed as subtraction
# and the build fails. Quoting the entry does not prevent the error.
articles:
- title: Using the families
  navbar: ~
  contents:
  - bicountbrms
  - articles/reparameterisation
  - articles/partially-paired-designs
  - prediction

reference:
- title: Families for paired counts
  desc: >
    Constructors for the bipois and binegbin families, which model a pair of
    counts by trivariate reduction with Poisson or negative-binomial
    components. Each family has a second constructor for partially paired
    designs, listed below, and the two constructors of a family share a
    likelihood and the post-processing methods.
  contents:
  - bipois
  - binegbin

- title: Partially paired designs
  desc: >
    Constructors for partially paired designs, in which source 1 has missing
    values. On an unpaired row, the likelihood term is the marginal probability
    of y2, so the row informs the shared component and the exclusive component
    of source 2.
  contents:
  - bipois_partialobs
  - binegbin_partialobs

- title: Prediction and imputation
  desc: >
    Draws and expectations of both counts together, and of y1 given the
    recorded y2. The functions conditional on y2 impute y1 on the unpaired rows of a fit from
    bipois_partialobs() or binegbin_partialobs().
  contents:
  - posterior_predict_y1_and_y2
  - posterior_predict_y1_given_y2

- title: Congruence–bias coordinates
  desc: >
    Conversion between the native parameters and the congruence–bias
    coordinates (the midpoint of the two expected counts, the congruence, and
    the source bias), and the brms formula for a model in the coordinates.
  contents:
  - mfd_to_dpars
  - dpars_to_mfd
  - bf_mfd

- title: Simulation
  desc: >
    Random generation of paired counts from the generating model of the bipois
    and binegbin families, with the shared and source-exclusive components of
    each pair.
  contents:
  - rbicount

