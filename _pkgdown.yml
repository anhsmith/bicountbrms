url: https://anhsmith.github.io/bicountbrms/

template:
  bootstrap: 5

reference:
- title: Joint bivariate-count families
  desc: >
    Model the matched pair jointly via trivariate reduction, capturing its
    correlation, marginal overdispersion, and difference together rather than
    the difference alone. Both counts must be observed on every row.
  contents:
  - bipois
  - binegbin

- title: Censoring-aware families
  desc: >
    The same two models, extended to rows on which the first count is
    unobserved, through the integrated-out marginal of the same joint. For
    Poisson components that marginal is closed form; for Negative-Binomial
    components it is a convolution, and the two source-specific components may
    differ in overdispersion.
  contents:
  - bipois_joint
  - binegbin_joint

- title: Parameterisation helpers
  desc: >
    Convert between the dpars a family takes and the interpretable coordinates
    of overall level, congruence, and source bias.
  contents:
  - binegbin_mfd_to_dpars
  - binegbin_dpars_to_mfd
