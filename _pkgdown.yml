url: https://anhsmith.github.io/bicountbrms/

template:
  bootstrap: 5

reference:
- title: Joint bivariate-count families
  desc: >
    Model the matched pair jointly via trivariate reduction, capturing its
    correlation, marginal overdispersion, and difference together rather than
    the difference alone. Each component distribution has one family name and
    two constructors: the plain one for a fully paired design, and the
    _partialobs one for a design in which the first count is missing on some
    rows. Both share a likelihood and a set of post-processing methods.
  contents:
  - bipois
  - binegbin

- title: Partially observed pairs
  desc: >
    The same two models, for rows on which the first count was never recorded.
    Those rows are scored by the integrated-out marginal of the same joint, so
    they still inform the shared component and the second source rather than
    being dropped. For Poisson components that marginal is closed form; for
    Negative-Binomial components it is a convolution. This is unrelated to
    brms's own cens() addition term, which means a value known to lie in a set.
  contents:
  - bipois_partialobs
  - binegbin_partialobs

- title: Parameterisation helpers
  desc: >
    Convert between the dpars a family takes and the interpretable coordinates
    of overall level, congruence, and source bias.
  contents:
  - binegbin_mfd_to_dpars
  - binegbin_dpars_to_mfd
