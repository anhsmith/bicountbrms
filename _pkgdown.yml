url: https://anhsmith.github.io/bicountbrms/

template:
  bootstrap: 5

# Ordered so that a reader meets "Choosing priors" before the anatomy article:
# the recipes and the class/dpar/nlpar mechanics apply in either
# parameterisation, and the anatomy article assumes them.
#
# Everything under vignettes/articles/ must be named with its `articles/`
# prefix here. pkgdown evaluates a bare entry as an R expression, so
# `families-and-parameters` is parsed as subtraction and the build fails with
# "unused argument (parameters)". Quoting the entry does not prevent the
# error.
articles:
- title: Using the families
  navbar: ~
  contents:
  - bicountbrms
  - articles/families-and-parameters
  - articles/choosing-priors
  - articles/partially-observed-fit

- title: Interpretation and history
  navbar: Interpretation and history
  contents:
  - articles/paired-count-anatomy
  - articles/migration-and-errata

reference:
- title: Joint bivariate-count families
  desc: >
    Model the pair of counts jointly via trivariate reduction, capturing its
    correlation, marginal overdispersion, and difference together rather than
    the difference alone. Each component distribution has one family name and
    two constructors: the plain constructor for a fully paired design, and the
    _partialobs constructor for a design in which the first count is missing
    on some rows. The two constructors of a family share a likelihood and a
    set of post-processing methods.
  contents:
  - bipois
  - binegbin

- title: Partially observed pairs
  desc: >
    The same two models, for rows on which the first count was never recorded.
    Those rows are scored by the integrated-out marginal of the same joint, so
    they still inform the shared component and the second source rather than
    being dropped. For Poisson components that marginal is closed form; for
    Negative-Binomial components it is a convolution. This is unrelated to
    the brms cens() addition term, which means a value known to lie in a set.
  contents:
  - bipois_partialobs
  - binegbin_partialobs

- title: Parameterisation helpers
  desc: >
    Convert between the dpars a family takes and the interpretable coordinates:
    the midpoint of the two expected counts, congruence, and source bias.
  contents:
  - binegbin_mfd_to_dpars
  - binegbin_dpars_to_mfd

- title: Example data
  desc: >
    A simulated partially paired dataset with known generating values, and its
    latent components.
  contents:
  - bicount_sim
  - bicount_sim_latent
