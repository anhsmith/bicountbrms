# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
#
# TWO JOBS, ON DELIBERATELY DIFFERENT CADENCES.
#
# Everything in this package that fits a model is behind skip_on_cran(), so a
# plain `R CMD check` runs the analytic and R-side tests and SKIPS every Stan
# fit. That is the right default -- compiling Stan models on every push would
# make the check useless -- but it means a check that does not set NOT_CRAN
# reports success while silently skipping the tests most likely to catch a real
# regression. Two assertions were failing undetected for weeks that way.
#
#   check       every push/PR. No Stan backend. ~5 minutes. The fast signal:
#               does it build, are the docs consistent, do the examples run,
#               do the analytic tests pass.
#
#   check-stan  weekly, plus on demand. Sets NOT_CRAN=true so the fitting tests
#               actually run, and installs BOTH backends because the suite needs
#               both: the difference families fit with cmdstanr, the joint
#               families with rstan, and the Stan-vs-R function comparisons use
#               rstan::expose_stan_functions().
#
# The coverage assessment (PAIREDCOUNTBRMS_COVERAGE) is deliberately NOT run
# here. It belongs before a release; see the README's "Running the tests".
#
# NOTE: GitHub disables scheduled workflows after 60 days with no commits to the
# repository. If this package goes quiet, the weekly run stops -- watch for the
# warning email, and use the Actions tab's "Run workflow" button to fire
# check-stan by hand at any time.

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Mondays, 06:00 UTC (Monday evening in NZ).
    - cron: '0 6 * * 1'
  workflow_dispatch:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  check:
    # Skip the fast job on the weekly cron -- check-stan supersedes it there.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # `dependencies: '"hard"'` skips Suggests, so no Stan backend is installed
      # and nothing here tries to compile a model. testthat/knitr/rmarkdown are
      # named explicitly because the tests and the vignette need them even
      # though they are Suggests.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::knitr
            any::rmarkdown
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual")'
          upload-snapshots: true

  check-stan:
    # Weekly and on demand only -- an hour of Stan compilation does not belong
    # on every push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # THE POINT OF THIS JOB. Without it every model fit is skipped.
      NOT_CRAN: true
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      # cmdstanr is not on CRAN; DESCRIPTION's Additional_repositories covers
      # pak, but the action needs telling too.
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: https://stan-dev.r-universe.dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::rstan
            any::cmdstanr
          needs: check

      # Compiling CmdStan takes ~10 minutes, so keep it between runs.
      - name: Cache CmdStan
        uses: actions/cache@v4
        with:
          path: ~/.cmdstan
          key: cmdstan-${{ runner.os }}-v1

      - name: Install CmdStan if not cached
        run: |
          if (is.null(cmdstanr::cmdstan_version(error_on_NA = FALSE))) {
            cmdstanr::install_cmdstan(cores = 2)
          } else {
            cat("CmdStan already present:", cmdstanr::cmdstan_version(), "\n")
          }
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual")'
          upload-snapshots: true
