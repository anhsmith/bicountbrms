# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
#
# TWO JOBS, ON DELIBERATELY DIFFERENT CADENCES.
#
# Everything in this package that fits a model is guarded twice: by
# skip_on_cran(), and by skip_if_no_stan() (tests/testthat/helper-stan.R), which
# tries to COMPILE a trivial Stan program. Both guards are needed and neither
# implies the other:
#
#   * r-lib/actions/check-r-package sets NOT_CRAN=true, so skip_on_cran() does
#     NOT fire in either job below. Do not assume otherwise.
#   * brms imports rstan, so rstan is present even under dependencies: 'hard'.
#     But the Boost headers (BH) are not, so rstan cannot compile a model.
#     skip_if_not_installed("brms") therefore does not establish that a fit can
#     run; only attempting a compile does.
#
# The first CI run of this package failed for exactly that reason: the
# difference-family fits skipped on a file-local stan_ready check while the
# joint-family fits, lacking one, reached rstan::stan_model() and errored with
# "Boost not found".
#
#   check       every push/PR. No Stan backend, so the model fits skip via
#               skip_if_no_stan(). ~5 minutes. The fast signal: does it build,
#               are the docs consistent, do the examples run, do the analytic
#               and R-side tests pass.
#
#   check-stan  weekly, plus on demand. Sets NOT_CRAN=true so the fitting tests
#               actually run, and installs BOTH backends because the suite needs
#               both: the difference families fit with cmdstanr, the joint
#               families with rstan, and the Stan-vs-R function comparisons use
#               rstan::expose_stan_functions().
#
# The coverage assessment (PAIREDCOUNTBRMS_COVERAGE) is deliberately NOT run
# here. It belongs before a release; see the README's "Running the tests".
#
# NOTE: GitHub disables scheduled workflows after 60 days with no commits to the
# repository. If this package goes quiet, the weekly run stops -- watch for the
# warning email, and use the Actions tab's "Run workflow" button to fire
# check-stan by hand at any time.

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Mondays, 06:00 UTC (Monday evening in NZ).
    - cron: '0 6 * * 1'
  workflow_dispatch:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  check:
    # Skip the fast job on the weekly cron -- check-stan supersedes it there.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # `dependencies: '"hard"'` skips Suggests, so no Stan backend is installed
      # and nothing here tries to compile a model. testthat/knitr/rmarkdown are
      # named explicitly because the tests and the vignette need them even
      # though they are Suggests.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::knitr
            any::rmarkdown
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual")'
          upload-snapshots: true

  check-stan:
    # Weekly and on demand only -- an hour of Stan compilation does not belong
    # on every push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # THE POINT OF THIS JOB. Without it every model fit is skipped.
      NOT_CRAN: true
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      # cmdstanr is not on CRAN; DESCRIPTION's Additional_repositories covers
      # pak, but the action needs telling too.
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: https://stan-dev.r-universe.dev

      # BH is named explicitly. It is in rstan's LinkingTo, not its Imports, so
      # installing a binary rstan from RSPM does NOT bring it -- and without the
      # Boost headers rstan cannot compile a model. That is what made the first
      # run of this job pass in 68 seconds while every fit skipped.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::rstan
            any::cmdstanr
            any::BH
            any::RcppEigen
            any::StanHeaders
          needs: check

      # Compiling CmdStan takes ~10 minutes, so keep it between runs.
      - name: Cache CmdStan
        uses: actions/cache@v5
        with:
          path: ~/.cmdstan
          key: cmdstan-${{ runner.os }}-v1

      - name: Install CmdStan if not cached
        run: |
          if (is.null(cmdstanr::cmdstan_version(error_on_NA = FALSE))) {
            cmdstanr::install_cmdstan(cores = 2)
          } else {
            cat("CmdStan already present:", cmdstanr::cmdstan_version(), "\n")
          }
        shell: Rscript {0}

      # FAIL LOUDLY RATHER THAN SKIP. The fitting tests are guarded by
      # skip_if_no_stan() (tests/testthat/helper-stan.R), which is correct for a
      # machine without a toolchain but turns this job into a silent no-op if it
      # ever lacks one: every fit skips and the job reports success. This job
      # exists to run those fits, so a broken toolchain is a failure, not a skip.
      - name: Verify the Stan toolchain before checking
        run: |
          ok <- tryCatch(
            { rstan::stan_model(model_code = "model {}"); TRUE },
            error = function(e) { message(conditionMessage(e)); FALSE }
          )
          if (!ok) {
            stop("check-stan requires a working Stan toolchain; refusing to ",
                 "pass by skipping every model fit.")
          }
          cat("Stan toolchain OK\n")
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual")'
          upload-snapshots: true

      # Guard against the inverse failure: the toolchain works but the fits are
      # skipped for some other reason, and the job still passes. Only the
      # coverage assessment should be skipped here.
      - name: Assert the model fits actually ran
        if: always()
        run: |
          f <- list.files("check", pattern = "testthat[.]Rout",
                          recursive = TRUE, full.names = TRUE)
          if (!length(f)) stop("no testthat output found")
          txt <- paste(readLines(f[1], warn = FALSE), collapse = "\n")
          m <- regmatches(txt, regexpr("SKIP [0-9]+", txt))
          if (!length(m)) stop("could not read a SKIP count from testthat output")
          n <- as.integer(sub("SKIP ", "", m))
          cat("skips reported:", n, "\n")
          if (n > 1) {
            stop("expected at most 1 skip (the coverage gate) but saw ", n,
                 " -- model fits are being skipped in a job meant to run them.")
          }
        shell: Rscript {0}
